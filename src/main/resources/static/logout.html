<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение выхода</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="text-center">Подтверждение выхода</h4>
                </div>
                <div class="card-body">
                    <p class="text-center">Вы точно хотите выйти?</p>

                    <form th:action="@{/logout}" method="post" class="text-center">
                        <!-- CSRF токен обязателен -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <button type="submit" class="btn btn-danger me-2">Да, выйти</button>
                        <a th:href="@{/}" class="btn btn-secondary">Нет, остаться</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
