<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Добавить пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
        }
        .is-invalid {
            border-color: #dc3545;
        }
        .error-container {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Добавить пользователя</h2>
    <div th:if="${errors != null and not errors.isEmpty()}" class="error-container">
        <h4>Ошибки ввода:</h4>
        <ul>
            <li th:each="error : ${errors.entrySet()}" th:text="${error.value}"></li>
        </ul>
    </div>

    <form th:action="@{/admin/add_user}" method="post">
        <div class="mb-3">
            <label for="firstName" class="form-label required-field">Имя</label>
            <input type="text" class="form-control" id="firstName" name="firstName"
                   th:value="${user?.firstName}" required
                   th:classappend="${errors != null and errors.containsKey('firstName')} ? 'is-invalid' : ''">
            <div th:if="${errors != null and errors.containsKey('firstName')}"
                 class="error-message" th:text="${errors.get('firstName')}"></div>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Фамилия</label>
            <input type="text" class="form-control" id="lastName" name="lastName"
                   th:value="${user?.lastName}"
                   th:classappend="${errors != null and errors.containsKey('lastName')} ? 'is-invalid' : ''">
            <div th:if="${errors != null and errors.containsKey('lastName')}"
                 class="error-message" th:text="${errors.get('lastName')}"></div>
        </div>
        <div class="mb-3">
            <label for="age" class="form-label required-field">Возраст</label>
            <input type="number" class="form-control" id="age" name="age"
                   th:value="${user?.age}" required
                   th:classappend="${errors != null and errors.containsKey('age')} ? 'is-invalid' : ''">
            <div th:if="${errors != null and errors.containsKey('age')}"
                 class="error-message" th:text="${errors.get('age')}"></div>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label required-field">Логин*</label>
            <input type="text" class="form-control" id="username" name="username"
                   th:value="${user?.username}" required
                   th:classappend="${errors != null and errors.containsKey('username')} ? 'is-invalid' : ''">
            <div th:if="${errors != null and errors.containsKey('username')}"
                 class="error-message" th:text="${errors.get('username')}"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label required-field">Пароль*</label>
            <input type="text" class="form-control" id="password" name="password"
                   th:value="${user?.firstName}" required
                   th:classappend="${errors != null and errors.containsKey('password')} ? 'is-invalid' : ''">
            <div th:if="${errors != null and errors.containsKey('password')}"
                 class="error-message" th:text="${errors.get('password')}"></div>
        </div>

        <button type="submit" class="btn btn-primary">ОК</button>
        <a th:href="@{/admin/users}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
