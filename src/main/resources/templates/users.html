<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Список пользователей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Дополнительные стили при необходимости */
        body {
            font-family: Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Список пользователей</h1>
    <a th:href="@{/users/add}" class="btn btn-primary mb-3">Добавить</a>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Возраст</th>
                <th>Логин</th>
                <th>Пароль</th>
                <th>Роли</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.firstName}"></td>
                <td th:text="${user.lastName} ?: '-'"></td>
                <td th:text="${user.age}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="'********'"></td>
                <td>
    <span th:each="role, stat : ${user.roles}">
        <span th:text="${role.name}"></span><span th:if="${!stat.last}">, </span>
    </span>
                </td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/edit_user(id=${user.id})}" class="btn btn-sm btn-warning me-1">Изменить</a>
                        <a th:href="@{/admin/delete_user(id=${user.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Вы уверены, что хотите удалить этого пользователя?')">Удалить</a>
                        <a th:href="@{/admin/assign_roles(id=${user.id})}" class="btn btn-sm btn-info">Назначить
                            роль</a>
                    </div>
                </td>

            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Убедимся, что браузер использует UTF-8
    document.charset = 'UTF-8';
</script>
</body>
</html>
