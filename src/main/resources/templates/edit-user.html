<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Изменить данные</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
        }
        .is-invalid {
            border-color: #dc3545;
        }
        .error-container {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <a class="logout-btn" th:href="@{/logout}">Log out</a>
    <h2>Изменить данные</h2>

    <!-- Блок для отображения общих ошибок -->
    <div th:if="${not errors.isEmpty()}" class="error-container">
        <h4>Ошибки ввода:</h4>
        <ul>
            <li th:each="error : ${errors.entrySet()}" th:text="${error.value}"></li>
        </ul>
    </div>

    <form th:action="@{/admin/users/edit}" method="post">
        <input type="hidden" name="id" th:value="${user.id}">

        <!-- First Name -->
        <div class="mb-3">
            <label for="firstName" class="form-label">Имя*</label>
            <input type="text" class="form-control" id="firstName" name="firstName"
                   th:value="${user.firstName}" required
                   th:classappend="${errors.containsKey('firstName')} ? 'is-invalid' : ''">
            <div th:if="${errors.containsKey('firstName')}" class="error-message"
                 th:text="${errors.get('firstName')}"></div>
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label for="lastName" class="form-label">Фамилия</label>
            <input type="text" class="form-control" id="lastName" name="lastName"
                   th:value="${user.lastName}"
                   th:classappend="${errors.containsKey('lastName')} ? 'is-invalid' : ''">
            <div th:if="${errors.containsKey('lastName')}" class="error-message"
                 th:text="${errors.get('lastName')}"></div>
        </div>

        <!-- Age -->
        <div class="mb-3">
            <label for="age" class="form-label">Возраст*</label>
            <input type="number" class="form-control" id="age" name="age"
                   th:value="${user.age}" required
                   th:classappend="${errors.containsKey('age')} ? 'is-invalid' : ''">
            <div th:if="${errors.containsKey('age')}" class="error-message"
                 th:text="${errors.get('age')}"></div>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Логин*</label>
            <input type="text" class="form-control" id="username" name="username"
                   th:value="${user.username}" required
                   th:classappend="${errors.containsKey('username')} ? 'is-invalid' : ''">
            <div th:if="${errors.containsKey('username')}" class="error-message"
                 th:text="${errors.get('username')}"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль*</label>
            <input type="password" class="form-control" id="password" name="password"
                   th:classappend="${errors.containsKey('password')} ? 'is-invalid' : ''">
            <div th:if="${errors.containsKey('password')}" class="error-message"
                 th:text="${errors.get('password')}"></div>
        </div>

        <div class="container mt-4">
            <h1 class="mb-4">Назначить роли пользователю</h1>

                <input type="hidden" name="id" th:value="${user.id}" />

                <div class="mb-3">
                    <label for="roles" class="form-label">Выберите роли</label>
                    <select id="roles" name="roles" class="form-control" multiple>
                        <option th:each="role : ${roles}"
                                th:value="${role.id}"
                                th:text="${role.name}"></option>
                    </select>
                </div>
        </div>

        <button type="submit" class="btn btn-primary">ОК</button>
        <a th:href="@{/admin/users}" class="btn btn-secondary">Отмена</a>

    </form>
</div>

</body>
</html>
