<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Добавить роль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
        }
        .is-invalid {
            border-color: #dc3545;
        }
        .error-container {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Добавить роль</h2>
    <div th:if="${errors != null and not errors.isEmpty()}" class="error-container">
        <h4>Ошибки ввода:</h4>
        <ul>
            <li th:each="error : ${errors.entrySet()}" th:text="${error.value}"></li>
        </ul>
    </div>

    <form th:action="@{/admin/add_role}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label required-field">Имя</label>
            <input type="text" class="form-control" id="name" name="name"
                   th:value="${role?.name}" required
                   th:classappend="${errors != null and errors.containsKey('name')} ? 'is-invalid' : ''">
            <div th:if="${errors != null and errors.containsKey('name')}"
                 class="error-message" th:text="${errors.get('name')}"></div>
        </div>

        <button type="submit" class="btn btn-primary">ОК</button>
        <a th:href="@{/admin/roles}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
