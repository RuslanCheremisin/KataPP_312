<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Назначить роли пользователю</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Дополнительные стили при необходимости */
        body {
            font-family: Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Назначить роли пользователю</h1>

    <form th:action="@{/admin/assign_roles}" method="post">
        <input type="hidden" name="id" th:value="${user.id}" />

        <div class="mb-3">
            <label for="roles" class="form-label">Выберите роли</label>
            <select id="roles" name="roles" class="form-control" multiple>
                <option th:each="role : ${roles}"
                        th:value="${role.id}"
                        th:text="${role.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Назначить роли</button>
    </form>

    <a th:href="@{/admin/users}" class="btn btn-secondary mt-3">Назад</a>
</div>

<script>
    // Убедимся, что браузер использует UTF-8
    document.charset = 'UTF-8';
</script>
</body>
</html>
