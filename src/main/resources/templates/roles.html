<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Список ролей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Дополнительные стили при необходимости */
        body {
            font-family: Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Список ролей</h1>
    <a th:href="@{/admin/add_role}" class="btn btn-primary mb-3">Добавить</a>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="role : ${roles}">
                <td th:text="${role.id}"></td>
                <td th:text="${role.name}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/edit_role(id=${role.id})}"
                           class="btn btn-sm btn-warning me-1">Изменить</a>
                        <a th:href="@{/admin/delete_role(id=${role.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Вы уверены, что хотите удалить эту роль?')">Удалить</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Убедимся, что браузер использует UTF-8
    document.charset = 'UTF-8';
</script>
</body>
</html>
