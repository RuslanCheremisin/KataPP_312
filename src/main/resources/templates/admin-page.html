<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar-tabs {
            width: 20%;
            min-width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            padding: 0;
            overflow-y: auto;
        }

        .main-content {
            width: 80%;
            padding: 30px;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .nav-tabs-custom {
            border-bottom: 2px solid #dee2e6;
        }

        .nav-tabs-custom .nav-item {
            margin-bottom: -2px;
        }

        .nav-tabs-custom .nav-link {
            border: none;
            border-bottom: 3px solid transparent;
            padding: 12px 20px;
            color: #495057;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-tabs-custom .nav-link:hover {
            border-bottom-color: #007bff;
            color: #007bff;
            background-color: transparent;
        }

        .nav-tabs-custom .nav-link.active {
            border-bottom-color: #007bff;
            color: #007bff;
            background-color: transparent;
            font-weight: 600;
        }

        .vertical-tabs {
            border-bottom: none;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .vertical-tabs .nav-item {
            width: 100%;
            margin: 0;
        }

        .vertical-tabs .nav-link {
            border: none;
            border-radius: 0;
            padding: 15px 20px;
            color: #495057;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            margin: 0;
            text-align: left;
            width: 100%;
            display: block;
        }

        .vertical-tabs .nav-link:hover {
            background-color: #f8f9fa;
            border-left-color: #007bff;
            color: #007bff;
        }

        .vertical-tabs .nav-link.active {
            background-color: #007bff !important;
            color: white !important;
            border-left-color: #0056b3;
            border: none;
        }

        .vertical-tabs .nav-item:not(:last-child) .nav-link {
            border-bottom: 1px solid #f1f1f1;
        }

        .browser-tabs {
            border-bottom: 2px solid #dee2e6;
            padding: 0 5px;
        }

        .browser-tabs .nav-item {
            margin-right: 5px;
        }

        .browser-tabs .nav-link {
            border: 1px solid #dee2e6;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            padding: 10px 20px;
            background-color: #f8f9fa;
            color: #495057;
            transition: all 0.3s ease;
            margin-bottom: -1px;
        }

        .browser-tabs .nav-link:hover {
            background-color: #e9ecef;
            color: #007bff;
        }

        .browser-tabs .nav-link.active {
            background-color: #ffffff !important;
            color: #007bff !important;
            border-bottom: 1px solid #ffffff;
            font-weight: 600;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.875em;
        }

        .is-invalid {
            border-color: #dc3545;
        }

        .error-container {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
        }

        @media (max-width: 992px) {
            .content-wrapper {
                flex-direction: column;
            }

            .sidebar-tabs {
                width: 100%;
                min-width: auto;
                border-right: none;
                border-bottom: 1px solid #dee2e6;
            }

            .vertical-tabs {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
            }

            .vertical-tabs .nav-item {
                width: auto;
                flex: 1;
                min-width: max-content;
            }

            .vertical-tabs .nav-link {
                border-left: none;
                border-bottom: 3px solid transparent;
                white-space: nowrap;
                text-align: center;
            }

            .vertical-tabs .nav-item:not(:last-child) .nav-link {
                border-bottom: 3px solid transparent;
                border-right: 1px solid #f1f1f1;
            }

            .vertical-tabs .nav-link:hover,
            .vertical-tabs .nav-link.active {
                border-left: none;
                border-bottom-color: #007bff;
            }

            .main-content {
                width: 100%;
                padding: 20px;
            }

            .browser-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .browser-tabs .nav-item {
                min-width: max-content;
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #5c5c5c;">
        <div class="container-fluid">
            <div class="d-flex">
                <span class="navbar-text text-white me-3">
                    <span th:text="${currentUser.username}">Username</span>
                </span>
                <span class="navbar-text text-light">
                    Роли:
                    <span th:each="role, iterStat : ${currentUser.roles}"
                          th:text="${role.name} + (${iterStat.last} ? '' : ', ')">
                    </span>
                </span>
            </div>
            <div class="ms-auto">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm">
                        Выход
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="sidebar-tabs">
            <ul class="nav flex-column vertical-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#settings" type="button"
                            role="tab">
                        Admin
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#profile" type="button"
                            role="tab">
                        User
                    </button>
                </li>
            </ul>
        </div>

        <div class="main-content">
            <div class="tab-content">
                <div class="tab-pane fade" id="profile" role="tabpanel">
                    <h2 class="mb-4">About user</h2>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Имя</th>
                                <th>Фамилия</th>
                                <th>Возраст</th>
                                <th>E-mail</th>
                                <th>Roles</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td th:text="${currentUser.id}"></td>
                                <td th:text="${currentUser.firstName}"></td>
                                <td th:text="${currentUser.lastName} ?: '-'"></td>
                                <td th:text="${currentUser.age}"></td>
                                <td th:text="${currentUser.username}"></td>
                                <td>
                                            <span th:each="role, stat : ${currentUser.roles}">
                                                <span th:text="${role.name}"></span><span
                                                    th:if="${!stat.last}">, </span>
                                            </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

                <div class="tab-pane fade show active" id="settings" role="tabpanel">
                    <h2 class="mb-4">User table</h2>

                    <ul class="nav nav-tabs browser-tabs mb-4" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#users-tab"
                                    type="button" role="tab">
                                Users
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#add-user-tab" type="button"
                                    role="tab">
                                Add User
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="users-tab" role="tabpanel">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Имя</th>
                                        <th>Фамилия</th>
                                        <th>Возраст</th>
                                        <th>E-mail</th>
                                        <th>Роли</th>
                                        <th>Действия</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.firstName}"></td>
                                        <td th:text="${user.lastName} ?: '-'"></td>
                                        <td th:text="${user.age}"></td>
                                        <td th:text="${user.username}"></td>
                                        <td>
                                            <span th:each="role, stat : ${user.roles}">
                                                <span th:text="${role.name}"></span><span
                                                    th:if="${!stat.last}">, </span>
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <button type="button" class="btn btn-sm btn-warning me-1 rounded"
                                                        data-bs-toggle="modal" data-bs-target="#editModal"
                                                        th:attr="data-user-id=${user.id},
                                                        data-user-firstname=${user.firstName},
                                                        data-user-lastname=${user.lastName},
                                                        data-user-age=${user.age},
                                                        data-user-username=${user.username}">
                                                    Изменить
                                                </button>
                                                <button type="button" class="btn btn-danger btn-sm rounded"
                                                        data-bs-toggle="modal" data-bs-target="#deleteModal"
                                                        th:attr="data-user-id=${user.id},
                                                        data-user-username=${user.username},
                                                        data-user-firstname=${user.firstName},
                                                        data-user-lastname=${user.lastName},
                                                        data-user-age=${user.age}">
                                                    Удалить
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="add-user-tab" role="tabpanel" th:fragment="add-user-form">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title text-center mb-4">Добавить нового пользователя</h5>
                                    <div class="container">
                                        <div th:if="${errors != null and not errors.isEmpty()}"
                                             class="error-container text-left">
                                            <ul class="list-unstyled">
                                                <li th:each="error : ${errors.entrySet()}" th:text="${error.value}"
                                                    class="text-danger"></li>
                                            </ul>
                                        </div>

                                        <form th:action="@{/admin/users/add}" method="post" class="mx-auto"
                                              style="max-width: 500px;">
                                            <!-- First Name -->
                                            <div class="mb-3">
                                                <label for="firstName" class="form-label">Имя*</label>
                                                <input type="text" class="form-control" id="firstName" name="firstName"
                                                       th:value="${user != null ? user.firstName : ''}" required
                                                       th:classappend="${errors != null && errors.containsKey('firstName')} ? 'is-invalid' : ''"/>
                                                <div th:if="${errors != null && errors.containsKey('firstName')}"
                                                     class="invalid-feedback"
                                                     th:text="${errors.get('firstName')}"></div>
                                            </div>

                                            <!-- Last Name -->
                                            <div class="mb-3">
                                                <label for="lastName" class="form-label">Фамилия</label>
                                                <input type="text" class="form-control" id="lastName" name="lastName"
                                                       th:value="${user != null ? user.lastName : ''}"
                                                       th:classappend="${errors != null && errors.containsKey('lastName')} ? 'is-invalid' : ''"/>
                                                <div th:if="${errors != null && errors.containsKey('lastName')}"
                                                     class="invalid-feedback"
                                                     th:text="${errors.get('lastName')}"></div>
                                            </div>

                                            <!-- Age -->
                                            <div class="mb-3">
                                                <label for="age" class="form-label">Возраст*</label>
                                                <input type="number" class="form-control" id="age" name="age"
                                                       th:value="${user != null ? user.age : ''}" required
                                                       th:classappend="${errors != null && errors.containsKey('age')} ? 'is-invalid' : ''"/>
                                                <div th:if="${errors != null && errors.containsKey('age')}"
                                                     class="invalid-feedback"
                                                     th:text="${errors.get('age')}"></div>
                                            </div>

                                            <div class="mb-3">
                                                <label for="username" class="form-label">Логин*</label>
                                                <input type="text" class="form-control" id="username" name="username"
                                                       th:value="${user != null ? user.username : ''}" required
                                                       th:classappend="${errors != null && errors.containsKey('username')} ? 'is-invalid' : ''"/>
                                                <div th:if="${errors != null && errors.containsKey('username')}"
                                                     class="invalid-feedback"
                                                     th:text="${errors.get('username')}"></div>
                                            </div>

                                            <div class="mb-3">
                                                <label for="password" class="form-label">Пароль*</label>
                                                <input type="password" class="form-control" id="password"
                                                       name="password"
                                                       th:classappend="${errors != null && errors.containsKey('password')} ? 'is-invalid' : ''">
                                                <div th:if="${errors != null && errors.containsKey('password')}"
                                                     class="invalid-feedback"
                                                     th:text="${errors.get('password')}"></div>
                                            </div>

                                            <div class="mb-4">
                                                <div class="mb-3">
                                                    <label for="roles" class="form-label">Выберите роли</label>
                                                    <select id="roles" name="roles" class="form-control" multiple
                                                            size="4">
                                                        <option th:each="role : ${roles}"
                                                                th:value="${role.id}"
                                                                th:text="${role.name}"></option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div class="d-flex gap-2 justify-content-center">
                                                <button type="submit" class="btn btn-primary">ОК</button>
                                                <a th:href="@{/admin}" class="btn btn-secondary">Отмена</a>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактирование пользователя</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm" th:action="@{/admin/users/edit}" method="post">
                <div class="modal-body">
                    <div class="card">
                        <div class="card-body">
                            <div class="container">
                                <div id="editErrors" class="error-container text-center" style="display: none;">
                                    <ul class="list-unstyled" id="editErrorsList"></ul>
                                </div>

                                <div class="mb-3">
                                    <label for="editFirstName" class="form-label">Имя*</label>
                                    <input type="text" class="form-control" id="editFirstName" name="firstName"
                                           required>
                                    <div class="invalid-feedback" id="editFirstNameError"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="editLastName" class="form-label">Фамилия</label>
                                    <input type="text" class="form-control" id="editLastName" name="lastName">
                                    <div class="invalid-feedback" id="editLastNameError"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="editAge" class="form-label">Возраст*</label>
                                    <input type="number" class="form-control" id="editAge" name="age" required>
                                    <div class="invalid-feedback" id="editAgeError"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="editUsername" class="form-label">Логин*</label>
                                    <input type="text" class="form-control" id="editUsername" name="username" required>
                                    <div class="invalid-feedback" id="editUsernameError"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="editPassword" class="form-label">Пароль</label>
                                    <input type="password" class="form-control" id="editPassword" name="password">
                                    <div class="invalid-feedback" id="editPasswordError"></div>
                                </div>

                                <div class="mb-4">
                                    <input type="hidden" name="id" id="editUserId"/>
                                    <div class="mb-3">
                                        <label for="editRoles" class="form-label">Выберите роли</label>
                                        <select id="editRoles" name="roles" class="form-control" multiple size="4">
                                            <option th:each="role : ${roles}"
                                                    th:value="${role.id}"
                                                    th:text="${role.name}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Внести изменения</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Подтверждение удаления</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="deleteForm" th:action="@{/admin/users/delete}" method="post">
                <div class="modal-body">
                    <p>Вы уверены, что хотите удалить пользователя <strong id="deleteUsername">username</strong>?</p>
                    <input type="hidden" name="id" id="deleteUserId"/>
                    <div class="card">
                        <div class="card-body">
                            <div class="container">
                                <!-- First Name -->
                                <div class="mb-3">
                                    <label class="form-label">Имя</label>
                                    <input type="text" class="form-control" id="deleteFirstName" disabled>
                                </div>

                                <!-- Last Name -->
                                <div class="mb-3">
                                    <label class="form-label">Фамилия</label>
                                    <input type="text" class="form-control" id="deleteLastName" disabled>
                                </div>

                                <!-- Age -->
                                <div class="mb-3">
                                    <label class="form-label">Возраст</label>
                                    <input type="number" class="form-control" id="deleteAge" disabled>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Логин</label>
                                    <input type="text" class="form-control" id="deleteUserUsername" disabled>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const editModal = document.getElementById('editModal');
        const deleteModal = document.getElementById('deleteModal');

        if (editModal) {
            editModal.addEventListener('show.bs.modal', function(event) {
                const button = event.relatedTarget;
                const editUser = /*[(${editUser != null})]*/ null;

                if (button) {
                    // Заполняем из data-атрибутов кнопки (обычное открытие)
                    const userId = button.getAttribute('data-user-id');
                    const firstName = button.getAttribute('data-user-firstname');
                    const lastName = button.getAttribute('data-user-lastname');
                    const age = button.getAttribute('data-user-age');
                    const username = button.getAttribute('data-user-username');

                    document.getElementById('editUserId').value = userId || '';
                    document.getElementById('editFirstName').value = firstName || '';
                    document.getElementById('editLastName').value = lastName || '';
                    document.getElementById('editAge').value = age || '';
                    document.getElementById('editUsername').value = username || '';
                    document.getElementById('editPassword').value = '';
                } else if (editUser) {
                    // Заполняем из flash attributes (при ошибках валидации)
                    document.getElementById('editUserId').value = editUser.id || '';
                    document.getElementById('editFirstName').value = editUser.firstName || '';
                    document.getElementById('editLastName').value = editUser.lastName || '';
                    document.getElementById('editAge').value = editUser.age || '';
                    document.getElementById('editUsername').value = editUser.username || '';
                    document.getElementById('editPassword').value = '';

                    // Показываем ошибки валидации
                    showEditFormErrors();
                }

                resetEditFormErrors();
            });

            editModal.addEventListener('hidden.bs.modal', resetEditFormErrors);
        }

        if (deleteModal) {
            deleteModal.addEventListener('show.bs.modal', function(event) {
                const button = event.relatedTarget;
                if (button) {
                    const userId = button.getAttribute('data-user-id');
                    const firstName = button.getAttribute('data-user-firstname');
                    const lastName = button.getAttribute('data-user-lastname');
                    const age = button.getAttribute('data-user-age');
                    const username = button.getAttribute('data-user-username');

                    document.getElementById('deleteUserId').value = userId || '';
                    document.getElementById('deleteUsername').textContent = username || '';
                    document.getElementById('deleteFirstName').value = firstName || '';
                    document.getElementById('deleteLastName').value = lastName || '';
                    document.getElementById('deleteAge').value = age || '';
                    document.getElementById('deleteUserUsername').value = username || '';
                }
            });
        }

        const hasEditErrors = /*[(${errors != null and not errors.isEmpty()})]*/ false;
        const hasEditUser = /*[(${editUser != null})]*/ false;

        if (hasEditErrors && hasEditUser && editModal) {
            setTimeout(function() {
                const modal = new bootstrap.Modal(editModal);

                // ЗАПОЛНЯЕМ ДАННЫЕ ПЕРЕД ОТКРЫТИЕМ
                const editUserData = /*[(${editUser})]*/ null;
                if (editUserData) {
                    document.getElementById('editUserId').value = editUserData.id || '';
                    document.getElementById('editFirstName').value = editUserData.firstName || '';
                    document.getElementById('editLastName').value = editUserData.lastName || '';
                    document.getElementById('editAge').value = editUserData.age || '';
                    document.getElementById('editUsername').value = editUserData.username || '';
                    document.getElementById('editPassword').value = '';

                    // ПОКАЗЫВАЕМ ОШИБКИ
                    showEditFormErrors();
                }

                modal.show();
            }, 100);
        }
    });

    function resetEditFormErrors() {
        const editErrors = document.getElementById('editErrors');
        const editErrorsList = document.getElementById('editErrorsList');

        if (editErrors) editErrors.style.display = 'none';
        if (editErrorsList) editErrorsList.innerHTML = '';

        const inputs = document.querySelectorAll('#editForm input, #editForm select');
        inputs.forEach(input => {
            input.classList.remove('is-invalid');
        });

        const errorDivs = document.querySelectorAll('#editForm .invalid-feedback');
        errorDivs.forEach(div => {
            div.textContent = '';
        });
    }

    function showEditFormErrors() {
        const errors = /*[(${errors})]*/ {};

        if (errors && Object.keys(errors).length > 0) {
            const editErrors = document.getElementById('editErrors');
            const editErrorsList = document.getElementById('editErrorsList');

            if (editErrors && editErrorsList) {
                editErrors.style.display = 'block';
                editErrorsList.innerHTML = '';

                Object.entries(errors).forEach(([field, message]) => {
                    const li = document.createElement('li');
                    li.className = 'text-danger';
                    li.textContent = message;
                    editErrorsList.appendChild(li);

                    // Помечаем поле как невалидное
                    const input = document.querySelector(`[name="${field}"]`);
                    if (input) {
                        input.classList.add('is-invalid');
                        const errorDiv = input.nextElementSibling;
                        if (errorDiv && errorDiv.classList.contains('invalid-feedback')) {
                            errorDiv.textContent = message;
                        }
                    }
                });
            }
        }
    }
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const hasErrors = /*[(${errors != null and not errors.isEmpty()})]*/ false;

        if (hasErrors) {
            setTimeout(function() {
                const addUserTabButton = document.querySelector('button[data-bs-target="#add-user-tab"]');
                if (addUserTabButton) {
                    const tab = new bootstrap.Tab(addUserTabButton);
                    tab.show();
                }
            }, 100);
        }

        const hash = window.location.hash;
        if (hash === '#add-user-tab') {
            const addUserTabButton = document.querySelector('button[data-bs-target="#add-user-tab"]');
            if (addUserTabButton) {
                const tab = new bootstrap.Tab(addUserTabButton);
                tab.show();
            }
        }
    });
</script>

</body>
</html>
